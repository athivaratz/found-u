; Read by php-fpm (DirectAdmin) and by mod_php from this directory.
; session.upload_progress.enabled is PHP_INI_PERDIR, so ini_set often
; does nothing. This file is the host-side switch.

expose_php = Off
display_errors = Off
log_errors = On
session.upload_progress.enabled = 0
session.upload_progress.cleanup = 0
allow_url_fopen = Off
allow_url_include = Off
memory_limit = 128M
max_execution_time = 30
post_max_size = 256K
upload_max_filesize = 256K
date.timezone = UTC
