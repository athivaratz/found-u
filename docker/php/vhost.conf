<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /srv/site/public_html

    # Authorization lives in public_html/.htaccess (Cloudflare allowlist).
    # mod_remoteip is left off on purpose: REMOTE_ADDR stays the TCP peer,
    # which is what `Require ip` for Cloudflare ranges assumes.
    <Directory /srv/site/public_html>
        Options FollowSymLinks
        AllowOverride All
        DirectoryIndex index.html
    </Directory>

    <Directory /srv/site/foundu>
        Require all denied
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
