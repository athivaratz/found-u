; Web requests also read public_html/.user.ini, which is what php-fpm on
; DirectAdmin will see. This file is the docker SAPI default.
; Composer runs from foundu/, so it keeps the higher memory_limit below.
; .user.ini is what a web request actually uses. Keep the two files together.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
html_errors = Off

; Do not trust the 8.2.36 default. This is PHP_INI_PERDIR.
session.upload_progress.enabled = 0
session.upload_progress.cleanup = 0

allow_url_fopen = Off
allow_url_include = Off
cgi.fix_pathinfo = 0

memory_limit = 256M
max_execution_time = 30
max_input_time = 30
; Apache still stops at 1.5 MiB. PHP then applies the per-route cap.
post_max_size = 8M
upload_max_filesize = 8M

date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000

apc.enabled = 1
apc.enable_cli = 1
apc.shm_size = 32M

session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax

realpath_cache_size = 4096K
realpath_cache_ttl = 600
